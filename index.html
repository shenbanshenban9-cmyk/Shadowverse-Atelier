function transferPanel(single=null){
 const section=document.createElement('section');
 section.className='transfer-panel';
 section.innerHTML=(single===null?'<h3>更改管理</h3><fieldset><legend>导出或还原范围</legend><label><input type="checkbox" value="cards" checked>卡牌</label> <label><input type="checkbox" value="stages" checked>背景</label></fieldset>':'')+
 '<p>配置包含已写入游戏的更改。</p><div class="pack-actions"><button data-action="export">'+(single===null?'导出所有更改':'另存单卡配置')+'</button>'+

 for(const button of section.querySelectorAll('[data-action]'))button.onclick=async()=>{
  const action=button.dataset.action, groups=single===null?Array.from(section.querySelectorAll(':checked'),el=>el.value):['cards'];
  const message=section.querySelector('[role=status]'),progress=section.querySelector('progress');
  if(action!=='import'&&!groups.length){message.textContent='请选择卡牌或背景';return}
  if(action==='restore'&&!await nativeConfirm('将所选范围（'+groups.map(x=>x==='cards'?'卡牌':'背景').join('、')+'）的已备份资源恢复到原始状态？'))return;
  if(action==='import'&&!await nativeConfirm('将配置中的更改写入当前游戏？工坊会先备份本机原始资源。'))return;
  const enabled=Array.from(modal.querySelectorAll('button:not(:disabled),input:not(:disabled)'));
  enabled.forEach(el=>el.disabled=true);
  const prevent=e=>e.preventDefault();modal.addEventListener('cancel',prevent);
  progress.hidden=false;progress.value=0;message.textContent='正在准备…';
  let active=true;
  async function poll(){try{const state=await window.pywebview.api.transfer_progress();if(active){progress.value=state.percent;message.textContent=state.label}}finally{if(active)setTimeout(poll,250)}}
  const timer=setTimeout(poll,350);
  try{
   const result=await window.pywebview.api.transfer(action,groups,single);
   if(result.error)throw Error(result.error);
   progress.value=result.cancelled?0:100;message.textContent=result.cancelled?'已取消':result.message;
  }catch(error){message.textContent=error.message}
  finally{active=false;clearTimeout(timer);enabled.forEach(el=>el.disabled=false);modal.removeEventListener('cancel',prevent)}
 };

function mountTitleParticles(title){
 const canvas=document.createElement('canvas');
 const ctx=canvas.getContext('2d');
 if(!ctx)return;
 const padding=64;
 const reduced=matchMedia('(prefers-reduced-motion:reduce)');
 const color='#08090b';
 const strokes=[
  'M7 4H58V37H7ZM16 12V17H49V12ZM16 24V29H49V24ZM27 36H37V44H62V52H3V44H27ZM9 57H57V77H37V90Q37 99 25 99H19L16 90H24Q27 90 27 86V77H9ZM18 64V70H48V64ZM12 79L20 83L7 96L1 91ZM44 79L54 85L49 93L38 85ZM89 1L98 9Q86 21 65 32L60 23ZM90 28L99 36Q84 51 66 62L60 54ZM92 55L101 64Q83 85 58 99L52 90Z',
  'M47 2L57 0L66 16L56 20ZM8 19H95V31Q75 54 39 77Q47 88 99 86L96 98H54Q37 98 29 86L9 99L3 89L23 72Q52 55 74 32H8Z',
  'M6 12H95V25H57V81H99V95H2V81H43V25H6Z',
  'M13 7H25V31H36V43H25V71L37 67L38 79L3 92L0 80L13 76V43H2V31H13ZM58 3L71 0L77 15L65 19ZM40 18H99V30H67V39H94L91 78Q89 98 76 98H64L60 86H72Q79 86 79 77L82 51H65Q61 79 43 99L32 90Q54 68 54 30H40Z'
 ].map(path=>new Path2D(path));
 const mask=document.createElement('canvas'),ink=mask.getContext('2d',{willReadFrequently:true});
 if(!ink)return;
 canvas.setAttribute('aria-hidden','true');
 title.classList.add('particles-ready');
 title.append(canvas);
 let points=[],pointer=null,frame=0,last=0,radius=54;
 function sample(){
  const w=title.clientWidth,h=title.clientHeight;
  if(!w||!h)return;
  const ratio=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.ceil((w+padding*2)*ratio);
  canvas.height=Math.ceil((h+padding*2)*ratio);
  ctx.setTransform(ratio,0,0,ratio,0,0);
  mask.width=w;mask.height=h;
  ink.fillStyle=color;
  ink.scale(w/208,h/206);
  strokes.forEach((shape,i)=>{
   ink.save();ink.translate((i%2)*107,Math.floor(i/2)*106);ink.fill(shape,'evenodd');ink.restore();
  });
  const pixels=ink.getImageData(0,0,w,h).data;
  const step=w>=300?2:1.6;
  radius=Math.min(62,w*.19);
  points=[];
  for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step){
   if(pixels[(Math.floor(y)*w+Math.floor(x))*4+3]<110)continue;
   const angle=Math.random()*Math.PI*2;
   points.push({
    x:x+padding,y:y+padding,
    size:step*(.86+Math.random()*.33),noiseX:Math.cos(angle)*3.5,noiseY:Math.sin(angle)*3.5,
    phase:Math.random()*Math.PI*2,dx:0,dy:0,z:0,blend:0
   });
  }
  paint(0,1);
 }
 function paint(now,ease){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(mask,padding,padding);
  let moving=false;
  ctx.fillStyle=color;
  const affected=[];
  for(const p of points){
   if(pointer&&Math.hypot(p.x-pointer.x,p.y-pointer.y)<radius||p.blend>.015)affected.push(p);
  }
  for(const p of affected){
   let dx=0,dy=0,z=0,blend=0;
   if(pointer){
    const x=p.x-pointer.x,y=p.y-pointer.y,d=Math.hypot(x,y),u=d/radius;
    if(u<1){
     const depth=(1-u*u)**3;
     const edge=u*(1-u)**2*44;
     blend=Math.min(1,(1-u)*2.2);
     dx=x/Math.max(d,1)*edge+p.noiseX*depth;
     dy=y/Math.max(d,1)*edge+p.noiseY*depth+Math.sin(now*.005+p.phase)*depth*2;
     z=depth*25;
    }
   }
   p.dx+=(dx-p.dx)*ease;p.dy+=(dy-p.dy)*ease;p.z+=(z-p.z)*ease;
   p.blend+=(blend-p.blend)*ease;
   if(p.blend>.015)moving=true;
   ctx.globalCompositeOperation='destination-out';
   ctx.globalAlpha=p.blend;
   const cell=mask.width>=300?2:1.6;
   ctx.fillRect(p.x-cell/2,p.y-cell/2,cell+.5,cell+.5);
  }
  ctx.globalCompositeOperation='source-over';
  for(const p of affected){
   const perspective=200/(200+p.z);
   const size=p.size*perspective;
   ctx.globalAlpha=p.blend*(1-p.z/115);
   ctx.fillRect(p.x+p.dx-size/2,p.y+p.dy+p.z*.25-size/2,size,size);
  }
  ctx.globalAlpha=1;
  return moving;
 }
 function draw(now){
  frame=0;
  if(!title.isConnected)return;
  const dt=Math.min(now-(last||now-16),40);last=now;
  const moving=paint(now,1-Math.exp(-dt/86));
  if(pointer||moving)frame=requestAnimationFrame(draw);
  else {for(const p of points)p.blend=p.dx=p.dy=p.z=0;paint(now,1)}
 }
 const resize=new ResizeObserver(sample);resize.observe(title);sample();
 const removal=new MutationObserver(()=>{
  if(title.isConnected)return;
  resize.disconnect();removal.disconnect();cancelAnimationFrame(frame);
 });
 removal.observe(main,{childList:true});
 title.addEventListener('pointermove',event=>{
  if(event.pointerType!=='mouse'||reduced.matches)return;
  const box=title.getBoundingClientRect();
  pointer={x:event.clientX-box.left+padding,y:event.clientY-box.top+padding};
  if(!frame){last=0;frame=requestAnimationFrame(draw)}
 });
 title.addEventListener('pointerleave',()=>{pointer=null});
 title.addEventListener('pointercancel',()=>{pointer=null});
}

async function edit(i){

  clearVoices();idx=i;fieldEdit=null;variantFieldEdits={};foilEdits={};changes={};urls={};placements={};slots=result;view='edit';detail();
 }catch(error){idx=previous;alert('无法打开卡牌编辑：'+error.message)}

function ratio(s){return s.kind==='header'||s.label.includes('横幅')?5:isFace(s)?848/1024:s.size[0]/s.size[1]}
function voices(tile){
 const names=['出牌时','攻击时','被破坏时','进化时','超进化时'];
 const columns=[...names.map(()=>[]),[]];
 slots.forEach((s,j)=>{
  if(!s.audio)return;
  const action=s.label.split(' · ')[0];
  const group=action.endsWith('攻击时')?1:action.endsWith('被破坏时')?2:names.indexOf(action);
  columns[group<0?5:group].push('<div>'+tile(s,j)+'<audio controls preload="none" src="'+(urls[j]||('listen?i='+idx+'&s='+j+'&v='+Date.now()))+'"></audio>'+voiceTools(j)+'</div>');
 });
 function column(name,items){return '<section><h3>'+name+'</h3>'+items.join('')+'</section>'}
 return '<div class="voice-scroll"><div class="voice-columns">'+names.map((name,i)=>column(name,columns[i])).join('')+'</div></div>'+(columns[5].length?column('其他语音',columns[5]):'');
}
function variantStates(){return slots.some(s=>s.variant===0&&s.state===1&&s.kind==="header")?[0,1]:[0]}
function variantOptions(){
 const groups=[...new Set(slots.filter(slot=>slot.kind==='face'&&slot.variant>0).map(slot=>slot.variant))];
 return groups.filter(group=>variantStates().every(state=>['face','header'].every(kind=>slots.some(slot=>slot.variant===group&&slot.state===state&&slot.kind===kind))));
}
function variantPlan(group){
 const plan=[];
 for(const state of variantStates()){
  for(const kind of ['face','header']){
   const source=slots.findIndex(slot=>slot.variant===group&&slot.state===state&&slot.kind===kind);
   const target=slots.findIndex(slot=>slot.variant===0&&slot.state===state&&slot.kind===kind);
   if(source<0||target<0)throw Error('这组异画缺少对应卡图或横幅');
   plan.push({source,target});
  }
 }
 const before=slots.find(slot=>slot.variant===group&&slot.state===0&&slot.kind==='face');
 const source=slots.findIndex(slot=>slot.variant===group&&slot.kind==='crest'&&slot.art===before.art);
 const target=slots.findIndex(slot=>slot.variant===0&&slot.kind==='crest'&&slot.art===cards[idx].art);
 if(source>=0&&target>=0)plan.push({source,target});
 return plan;
}
async function syncVariantVoice(group,cardIndex){
 const plan=await fetch('variant-voice?i='+cardIndex+'&group='+group);
 const data=await plan.json();
 if(!plan.ok)throw Error(data.error||'异画语音读取失败');
 let count=0;
 for(const row of data.slots){
  const response=await fetch('variant-audio?i='+cardIndex+'&group='+group+'&slot='+row.slot);
  if(!response.ok)throw Error('异画语音读取失败');
  const bytes=new Uint8Array(await response.arrayBuffer());let binary='';
  for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
  const wem=btoa(binary);
  changes[row.slot]=wem;delete voiceStates[row.slot];
  try{await stagePreview(row.slot,wem)}catch(error){}
  count++;
 }
 return count;
}
async function useVariant(group,button,syncVoice){
 if(button)button.disabled=true;
 const cardIndex=idx;
 try{
  const plan=variantPlan(group);
  let framing=null;
  if(cards[cardIndex].typ===1){
   const response=await fetch('variant-field?i='+cardIndex+'&variant='+group);
   const result=await response.json();
   if(!response.ok)throw Error(result.error||'异画取景读取失败');
   framing={before:fieldEdit?.before||result.before,after:(variantFieldEdits[group]?.after||result.after).slice(),states:[0,1,2]};
  }
  const prepared=await Promise.all(plan.map(async({source,target})=>{
   const image=await loadPicture(urls[source]||nocache('current?i='+cardIndex+'&s='+source));
   const canvas=document.createElement('canvas');
   [canvas.width,canvas.height]=slots[target].size;
   const context=canvas.getContext('2d');context.imageSmoothingQuality='high';
   context.drawImage(image,0,0,canvas.width,canvas.height);
   return {target,url:canvas.toDataURL('image/png')};
  }));
  if(idx!==cardIndex||view!=='edit')return;
  for(const {target,url} of prepared){
   urls[target]=url;changes[target]=url.split(',')[1];delete placements[target];
  }
  for(const {source,target} of plan){
   if(slots[target].foil)foilEdits[slots[target].art]=slots[source].foil?(foilEdits[slots[source].art]?.startsWith('common')?foilEdits[slots[source].art]:slots[source].art):'common';
  }
  if(framing)fieldEdit=framing;
  let voices=0;
  if(syncVoice){
   try{voices=await syncVariantVoice(group,cardIndex)}
   catch(error){alert(error.message+'（已跳过异画语音，只替换卡图与横幅）')}
  }
  if(modal.open)modal.close();
  detail();
  const status=document.createElement('p');status.className='field-status';
  status.textContent='异画 '+group+(voices?' 与 '+voices+' 条异画语音':'')+'已加入待替换内容，点击“备份并替换”写入游戏。';
  main.querySelector('.card-title').after(status);
 }catch(error){alert(error.message)}
 finally{if(button?.isConnected)button.disabled=false}
}
